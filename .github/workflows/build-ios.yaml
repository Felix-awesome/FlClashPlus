name: build-ios

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  BUNDLE_ID: 'com.follow.clash'
  APP_GROUP: 'group.com.follow.clash'

jobs:
  ios:
    name: iOS (unsigned ipa)
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup xcodeproj gem
        run: |
          gem install xcodeproj --no-document

      - name: Build Go core xcframework
        run: bash tool/build_ios_core.sh ios/FlClashCore.xcframework

      - name: Build iOS app (unsigned)
        run: bash tool/build_ios_app.sh ${{ env.BUNDLE_ID }} ${{ env.APP_GROUP }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-unsigned-ipa
          path: dist/FlClash-unsigned.ipa

      # The flutter build error is otherwise only visible in the runner's step
      # log (needs admin to download). Publish the full log as an artifact so it
      # can be inspected without elevated permissions.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: dist/ios_build.log
