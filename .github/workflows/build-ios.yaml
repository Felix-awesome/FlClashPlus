name: build-ios

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  BUNDLE_ID: 'com.follow.clash'
  APP_GROUP: 'group.com.follow.clash'

jobs:
  ios:
    name: iOS (unsigned ipa)
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup xcodeproj gem
        run: |
          gem install xcodeproj --no-document

      # The macos-15 image ships Xcode 26.x alongside the default Xcode 16.4.
      # Our *_plus plugins (device_info_plus 13.x, connectivity_plus 7.x, etc.)
      # use iOS 26 SDK APIs (e.g. NWPath.isUltraConstrained, NSProcessInfo
      # .isiOSAppOnVision), so we must switch to Xcode 26 to compile them.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Build Go core xcframework
        run: bash tool/build_ios_core.sh ios/FlClashCore.xcframework

      - name: Build iOS app (unsigned)
        run: bash tool/build_ios_app.sh ${{ env.BUNDLE_ID }} ${{ env.APP_GROUP }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-unsigned-ipa
          path: dist/FlClash-unsigned.ipa

      # Cheap verification: publish the processed Info.plists so the appex
      # bundle id / version / executable keys can be checked without pulling
      # the ~52MB IPA down.
      - name: Dump IPA metadata
        if: always()
        run: |
          mkdir -p /tmp/ipadump
          cd /tmp/ipadump
          unzip -o -q "$GITHUB_WORKSPACE/dist/FlClash-unsigned.ipa" \
            "Payload/Runner.app/Info.plist" \
            "Payload/Runner.app/PlugIns/FlClashService.appex/Info.plist" || true
          {
            echo "== Runner.app =="
            plutil -p Payload/Runner.app/Info.plist || true
            echo
            echo "== FlClashService.appex =="
            plutil -p Payload/Runner.app/PlugIns/FlClashService.appex/Info.plist || true
          } > "$GITHUB_WORKSPACE/dist/ipa_info.txt"

      - name: Upload IPA metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-metadata
          path: dist/ipa_info.txt

      # The flutter build error is otherwise only visible in the runner's step
      # log (needs admin to download). Publish the full log as an artifact so it
      # can be inspected without elevated permissions.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: dist/ios_build.log
