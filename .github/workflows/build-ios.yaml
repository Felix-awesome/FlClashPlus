name: build-ios

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  BUNDLE_ID: 'com.follow.clash'
  APP_GROUP: 'group.com.follow.clash'

jobs:
  ios:
    name: iOS (unsigned ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Build Go core xcframework
        run: bash tool/build_ios_core.sh ios/FlClashCore.xcframework

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p dist
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qry ../../dist/FlClash-unsigned.ipa Payload
          cd ../..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-unsigned-ipa
          path: dist/FlClash-unsigned.ipa
